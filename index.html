<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<meta name="description" content="A small collection of browser games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* four colours, that's the whole scheme */
  --page:#FBF7F2;      /* warm off-white, the whole background */
  --card:#FFFFFF;      /* cards sit a touch above it */
  --ink:#4A352F;       /* deep umber */
  --accent:#9E472A;    /* muted rust */

  --line:rgba(74,53,47,.15);
  --display:"Fraunces", Georgia, serif;
  --ui:"Archivo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--ui);
  min-height:100vh;-webkit-font-smoothing:antialiased}

.wrap{max-width:860px;margin:0 auto;padding:clamp(40px,9vh,90px) 22px 70px}

.title{font-family:var(--display);font-weight:900;font-size:clamp(46px,11vw,104px);
  line-height:.86;letter-spacing:-.03em;margin:0}
.blurb{font-size:15px;line-height:1.6;color:rgba(74,53,47,.72);max-width:44ch;margin:22px 0 0}

.list{margin:clamp(38px,7vh,66px) 0 0;border-top:1px solid var(--line)}

.game{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:20px;
  padding:26px 4px;border-bottom:1px solid var(--line);
  color:inherit;text-decoration:none;position:relative;
  transition:padding-left .22s ease, background .22s ease}
.game:hover,.game:focus-visible{padding-left:16px;background:var(--card);outline:none;box-shadow:0 1px 3px rgba(74,53,47,.1)}
.game:focus-visible{box-shadow:inset 3px 0 0 var(--accent)}

.pip{width:10px;height:10px;border-radius:2px;transition:transform .22s ease}
.game:hover .pip{transform:scale(1.7) rotate(45deg)}

.game h2{font-family:var(--display);font-weight:600;font-size:clamp(24px,4.4vw,36px);
  line-height:1.05;margin:0 0 6px;letter-spacing:-.01em}
.game p{margin:0;font-size:13.5px;line-height:1.5;color:rgba(74,53,47,.66);max-width:48ch}
.meta{font-size:12px;color:rgba(74,53,47,.5);white-space:nowrap;align-self:center}
.game[data-soon]{pointer-events:none}
.game[data-soon] h2,.game[data-soon] p{opacity:.42}

@media(max-width:560px){
  .game{grid-template-columns:10px 1fr;gap:14px;padding:22px 2px}
  .meta{grid-column:2;margin-top:8px}
}
@media(prefers-reduced-motion:reduce){.game,.pip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">Games</h1>
  <p class="blurb">Things built to play over a call. Nothing here needs an account,
     a server, or an internet connection once the page has loaded.</p>

  <div class="list" id="list"></div>
</div>

<script>
/* ============================================================
   Add a game by adding a line here and dropping its folder
   next to this file. Nothing else to wire up.

     path  folder name, or leave it out to grey the row out
     pip   the little marker colour

   Keep paths relative (no leading slash) so the site works
   whatever address it ends up living at.
   ============================================================ */
const GAMES = [
  {
    title: "Guess Who",
    path:  "guess-who/",
    blurb: "Build a board of 24 out of anyone you like, drop in photos, " +
           "and narrow it down while you talk.",
    meta:  "2 players",
    pip:   "#9E472A"
  },
  {
    title: "Something else",
    blurb: "Not built yet.",
    meta:  "soon",
    pip:   "#4A352F"
  }
];

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

document.getElementById("list").innerHTML = GAMES.map(g => {
  const live = !!g.path;
  const tag = live ? "a" : "div";
  const attr = live ? ` href="${esc(g.path)}"` : ' data-soon="1"';
  return `<${tag} class="game"${attr}>
      <span class="pip" style="background:${esc(g.pip || "#D9B99B")}"></span>
      <span><h2>${esc(g.title)}</h2><p>${esc(g.blurb || "")}</p></span>
      <span class="meta">${esc(g.meta || "")}</span>
    </${tag}>`;
}).join("");
</script>
</body>
</html>
